name: Validate source

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 此工作流只做 TypeScript/Vite 源码校验，不打包 Electron。
      # 忽略依赖安装期间的 postinstall，可避免 Electron 二进制下载波动
      # 使源码校验失败；npm run build 本身不依赖这些安装脚本的产物。
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build production files
        run: npm run build
